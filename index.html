<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes API Client</h1>
      <p>Talking to a practice API: JSONPlaceholder</p>
    </header>

    <main>
      <section>
        <h2>Create a note</h2>
        <form id="note-form">
          <label for="title-input">Title</label>
          <input
            type="text"
            id="title-input"
            name="title"
            placeholder="Note title"
          />

          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" name="body" rows="4"></textarea>

          <button type="submit" id="submit-btn">Create note</button>
        </form>
      </section>

      <section>
        <h2>Notes from the server</h2>
        <button type="button" id="load-btn">Load notes</button>
        <p id="status" role="status"></p>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </body>
</html>
